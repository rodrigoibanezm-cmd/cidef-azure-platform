name: Auto deploy Inteligencia Comercial staging

on:
  repository_dispatch:
    types: [cidef-inteligencia-staging-push]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-inteligencia-staging-auto
  cancel-in-progress: false

jobs:
  deploy:
    uses: rodrigoibanezm-cmd/cidef-azure-platform/.github/workflows/deploy-inteligencia-comercial-staging.yml@main
    secrets: inherit
