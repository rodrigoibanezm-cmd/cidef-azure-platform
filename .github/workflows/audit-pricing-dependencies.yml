name: Audit pricing dependencies in Azure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-pricing-dependencies.yml'

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Resolve Azure PostgreSQL connection without exposing secrets
        id: db
        shell: bash
        run: |
          set -euo pipefail
          RG=rg-cidef-prod
          JOB=cidef-data-loader-job

          # Find which Container Apps Job secret is referenced by AZURE_DATABASE_URL.
          SECRET_REF=$(az containerapp job show             --resource-group "$RG"             --name "$JOB"             --query "properties.template.containers[0].env[?name=='AZURE_DATABASE_URL'].secretRef | [0]"             -o tsv)

          if [[ -z "$SECRET_REF" ]]; then
            echo "::error::Existing $JOB does not expose an AZURE_DATABASE_URL secretRef"
            exit 1
          fi

          # Read secret value only into the process environment. Never print it.
          TARGET_URL=$(az containerapp job secret list             --resource-group "$RG"             --name "$JOB"             --query "[?name=='$SECRET_REF'].value | [0]"             -o tsv)

          if [[ -z "$TARGET_URL" ]]; then
            echo "::error::Could not resolve the referenced Azure DB secret from $JOB"
            exit 1
          fi

          echo "::add-mask::$TARGET_URL"

          # Persist masked value only for subsequent steps in this job.
          {
            echo 'TARGET_URL<<EOF'
            echo "$TARGET_URL"
            echo 'EOF'
          } >> "$GITHUB_ENV"

          echo "Resolved Azure PostgreSQL connection from existing job secret reference."

      - name: Audit required pricing tables
        shell: bash
        run: |
          set -euo pipefail

          psql "$TARGET_URL" -X -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null

          TABLES=(
            price_episode_canonico_v01
            versiones_master_v01
            modelos_master_v01
            marcas_master_v01
            producto_aliases_v01
            vehiculo_canonico
            ventas_raw
            notas_credito_raw
          )

          echo "=== PRICING DEPENDENCY AUDIT ==="
          echo "database=$(psql "$TARGET_URL" -X -Atqc 'SELECT current_database()')"
          echo

          missing=0

          for table in "${TABLES[@]}"; do
            echo "## $table"
            row=$(psql "$TARGET_URL" -X -Atqc "
              SELECT table_schema || '|' || table_type
              FROM information_schema.tables
              WHERE table_name = '$table'
              ORDER BY CASE WHEN table_schema='public' THEN 0 ELSE 1 END, table_schema
              LIMIT 1
            ")

            if [[ -z "$row" ]]; then
              echo "status=MISSING"
              missing=$((missing+1))
              echo
              continue
            fi

            schema=$(echo "$row" | cut -d'|' -f1)
            type=$(echo "$row" | cut -d'|' -f2)
            count=$(psql "$TARGET_URL" -X -Atqc "SELECT count(*) FROM \"$schema\".\"$table\"")

            echo "status=FOUND"
            echo "schema=$schema"
            echo "type=$type"
            echo "rows=$count"

            if [[ "$table" = "price_episode_canonico_v01" ]]; then
              psql "$TARGET_URL" -X -Atqc "
                SELECT 'min_vigencia_desde=' || COALESCE(min(vigencia_desde)::text,'NULL') FROM \"$schema\".\"$table\";
                SELECT 'max_vigencia_desde=' || COALESCE(max(vigencia_desde)::text,'NULL') FROM \"$schema\".\"$table\";
              "
            fi

            if [[ "$table" = "ventas_raw" ]]; then
              psql "$TARGET_URL" -X -Atqc "
                SELECT 'min_fecha_factura=' || COALESCE(min(fecha_factura),'NULL') FROM \"$schema\".\"$table\";
                SELECT 'max_fecha_factura=' || COALESCE(max(fecha_factura),'NULL') FROM \"$schema\".\"$table\";
              "
            fi

            echo
          done

          echo "=== SUMMARY ==="
          echo "missing_tables=$missing"
          echo "Audit is read-only; no schema or data changes were performed."
