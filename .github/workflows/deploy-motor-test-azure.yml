name: Deploy independent motor-test MCP to Azure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/ventas/loadVentasRows.js'
      - 'lib/ventas/ventasContextUtils.js'
      - 'lib/data-floor/sales/contract.js'
      - 'lib/data-floor/sales/dataset.js'
      - 'lib/data-floor/sales/multiObserve.js'
      - 'lib/data-floor/forum/contract.js'
      - 'lib/data-floor/forum/observations.js'
      - 'lib/data-floor/forum/query.js'
      - 'test/forum-p1-semantics.test.js'
      - 'scripts/validate-projection-p1-contracts.js'
      - 'lib/mcp/server.js'
      - 'scripts/validate-sales-financial-p1.js'
      - 'test/sales-p1-contract.test.js'
      - '.github/workflows/deploy-motor-test-azure.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 60
    env:
      AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
      RG: rg-cidef-prod
      ACA_ENV: cidef-prod-env
      APP: cidef-motor-test-azure
      ACR: cidefprodacr.azurecr.io
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Azure login via existing GitHub OIDC identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preflight existing Azure resources and DB secret
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${AZURE_DATABASE_URL:-}" ]] || { echo "::error::AZURE_DATABASE_URL is missing from Production"; exit 1; }

          az extension add --name containerapp --upgrade --yes
          ACA_ENV_ID=$(az containerapp env show --resource-group "$RG" --name "$ACA_ENV" --query id --output tsv)
          [[ -n "$ACA_ENV_ID" ]] || { echo "::error::Existing Container Apps environment cidef-prod-env was not found"; exit 1; }

          IDENTITY_ID=$(az identity show --resource-group "$RG" --name id-cidef-azure-pg-mcp --query id --output tsv)
          PRINCIPAL_ID=$(az identity show --resource-group "$RG" --name id-cidef-azure-pg-mcp --query principalId --output tsv)
          ACR_ID=$(az acr show --name cidefprodacr --resource-group "$RG" --query id --output tsv)
          [[ -n "$IDENTITY_ID" && -n "$PRINCIPAL_ID" && -n "$ACR_ID" ]] || { echo "::error::Existing ACR or user-assigned identity was not found"; exit 1; }
          ACR_PULL_COUNT=$(az role assignment list --assignee-object-id "$PRINCIPAL_ID" --scope "$ACR_ID" --include-inherited --query "[?roleDefinitionName=='AcrPull'] | length(@)" --output tsv)
          [[ "$ACR_PULL_COUNT" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Existing AcrPull assignment for id-cidef-azure-pg-mcp is missing; no role assignment was attempted"; exit 1; }

          # GitHub OIDC is used only for Azure deployment. The personal MCP endpoint accepts requests without OAuth.
          echo "IDENTITY_ID=$IDENTITY_ID" >> "$GITHUB_ENV"

          EXISTING_APP_JSON=$(mktemp)
          AZURE_CLI_ERROR=$(mktemp)
          APP_FOUND=false
          for attempt in 1 2 3 4; do
            if az containerapp show --resource-group "$RG" --name "$APP" --output json > "$EXISTING_APP_JSON" 2>"$AZURE_CLI_ERROR"; then
              APP_FOUND=true
              break
            fi
            if grep -Eqi 'Service Unavailable|HTTPError.*503|status code: 503' "$AZURE_CLI_ERROR"; then
              if [[ "$attempt" -lt 4 ]]; then
                echo "ARM returned HTTP 503 while reading the existing Container App; retry $attempt/4."
                sleep $((attempt * 10))
                continue
              fi
              echo "::error::ARM remained unavailable while reading the existing Container App"
            else
              echo "::error::Could not read the existing motor-test Container App; no resource creation was attempted"
            fi
            rm -f "$EXISTING_APP_JSON" "$AZURE_CLI_ERROR"
            exit 1
          done
          rm -f "$AZURE_CLI_ERROR"
          [[ "$APP_FOUND" == "true" ]] || { echo "::error::Existing motor-test Container App was not found; refusing to create infrastructure or assign ACR roles"; exit 1; }
          python3 - "$EXISTING_APP_JSON" "$ACA_ENV_ID" "$IDENTITY_ID" <<'PY'
          import json, sys
          app=json.load(open(sys.argv[1], encoding="utf-8"))
          expected_env, expected_identity=sys.argv[2:]
          properties=app.get("properties", {})
          identity=app.get("identity", {}).get("userAssignedIdentities", {})
          ingress=properties.get("configuration", {}).get("ingress", {})
          registries=properties.get("configuration", {}).get("registries", [])
          if properties.get("managedEnvironmentId") != expected_env:
              raise SystemExit("::error::Existing motor-test app uses a different Container Apps environment; refusing to alter it")
          if expected_identity not in identity:
              raise SystemExit("::error::Existing motor-test app is not attached to the reusable image-pull identity")
          if not ingress.get("external") or ingress.get("targetPort") != 3000:
              raise SystemExit("::error::Existing motor-test app ingress is not the expected port 3000; refusing to change networking")
          if not any(r.get("server", "").lower() == "cidefprodacr.azurecr.io" and r.get("identity") == expected_identity for r in registries):
              raise SystemExit("::error::Existing motor-test app does not use the reusable ACR identity")
          PY
          rm -f "$EXISTING_APP_JSON"

      - name: Build and push the isolated motor-test image to the existing ACR
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name cidefprodacr
          IMAGE="$ACR/cidef-motor-test-azure:$GITHUB_SHA"
          docker build --file Dockerfile.motor-test-azure --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update only the existing independent motor-test Container App
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update --resource-group "$RG" --name "$APP" --image "$IMAGE" --output none
          az containerapp secret set --resource-group "$RG" --name "$APP" --secrets "database-url=$AZURE_DATABASE_URL" --output none
          az containerapp update --resource-group "$RG" --name "$APP" --set-env-vars \
            "AZURE_DATABASE_URL=secretref:database-url" \
            --remove-env-vars MCP_ENTRA_CLIENT_ID MCP_ENTRA_TENANT_ID MCP_PUBLIC_URL \
            --output none

          APP_STATE_JSON=$(mktemp)
          ERROR_FILE=$(mktemp)
          STATE=""
          for attempt in {1..36}; do
            SHOW_OK=false
            for retry in 1 2 3 4; do
              if az containerapp show --resource-group "$RG" --name "$APP" --output json > "$APP_STATE_JSON" 2>"$ERROR_FILE"; then
                SHOW_OK=true
                break
              fi
              if grep -Eqi 'Service Unavailable|HTTPError.*503|status code: 503' "$ERROR_FILE"; then
                if [[ "$retry" -lt 4 ]]; then
                  echo "ARM returned HTTP 503 while checking Container App state; retry $retry/4."
                  sleep $((retry * 10))
                  continue
                fi
                echo "::error::ARM remained unavailable while checking Container App state"
              else
                echo "::error::Could not read Container App state; not retrying a non-transient error"
              fi
              rm -f "$APP_STATE_JSON" "$ERROR_FILE"
              exit 1
            done
            [[ "$SHOW_OK" == "true" ]] || { rm -f "$APP_STATE_JSON" "$ERROR_FILE"; exit 1; }
            STATE=$(python3 - "$APP_STATE_JSON" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8")).get("properties", {}).get("provisioningState", ""))
          PY
          )
            [[ "$STATE" == "Succeeded" ]] && break
            [[ "$STATE" != "Failed" ]] || { echo "::error::motor-test Container App provisioning failed"; rm -f "$APP_STATE_JSON" "$ERROR_FILE"; exit 1; }
            sleep 5
          done
          [[ "$STATE" == "Succeeded" ]] || { echo "::error::motor-test Container App provisioning timed out"; rm -f "$APP_STATE_JSON" "$ERROR_FILE"; exit 1; }

          FQDN=$(python3 - "$APP_STATE_JSON" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8")).get("properties", {}).get("configuration", {}).get("ingress", {}).get("fqdn", ""))
          PY
          )
          rm -f "$APP_STATE_JSON" "$ERROR_FILE"
          [[ -n "$FQDN" ]] || { echo "::error::The independent Container App has no ingress FQDN"; exit 1; }

          REVISION_MODE=$(az containerapp show --resource-group "$RG" --name "$APP" --query properties.configuration.activeRevisionsMode --output tsv)
          if [[ "$REVISION_MODE" == "Multiple" ]]; then
            az containerapp ingress traffic set --resource-group "$RG" --name "$APP" --revision-weight latest=100 --output none
          fi
          DEPLOYED_IMAGE=$(az containerapp show --resource-group "$RG" --name "$APP" --query properties.template.containers[0].image --output tsv)
          [[ "$DEPLOYED_IMAGE" == "$IMAGE" ]] || { echo "::error::Latest Container App revision image does not match the image just built"; exit 1; }
          echo "Active revision mode: $REVISION_MODE; deployed image: $DEPLOYED_IMAGE"

          echo "APP_URL=https://$FQDN" >> "$GITHUB_ENV"
          echo "Independent MCP endpoint: https://$FQDN/api/mcp" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify health and Azure PostgreSQL readiness
        shell: bash
        run: |
          set -euo pipefail
          HEALTH=""
          READY=""
          for attempt in {1..36}; do
            HEALTH=$(curl --silent --output /dev/null --write-out '%{http_code}' "$APP_URL/healthz" || true)
            READY=$(curl --silent "$APP_URL/readyz" || true)
            [[ "$HEALTH" == "200" && "$READY" == *'"database":"connected"'* ]] && break
            sleep 5
          done
          [[ "$HEALTH" == "200" ]] || { echo "::error::motor-test health check failed"; exit 1; }
          [[ "$READY" == *'"database":"connected"'* ]] || { echo "::error::SELECT 1 readiness check against Azure PostgreSQL failed"; exit 1; }

          echo "Health and PostgreSQL SELECT 1 readiness checks passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Install MCP client dependencies for anonymous integration checks
        run: npm install --no-save --no-package-lock --ignore-scripts @modelcontextprotocol/sdk@1.26.0 zod@3.25.76 pg@8.16.3

      - name: Verify SALES recognition preserves financial entity
        run: node --test test/sales-p1-contract.test.js

      - name: Verify anonymous remote MCP transport and 12 tools
        run: MCP_SMOKE_URL="$APP_URL/api/mcp" node motor-test-azure/smoke-test.js

      - name: Validate exposed SALES and FORUM P1 projection contracts on Azure
        run: MCP_URL="$APP_URL/api/mcp" node scripts/validate-projection-p1-contracts.js

      - name: Reconcile SALES recognized VINs by store and financing entity in Azure PostgreSQL
        run: node scripts/validate-sales-financial-p1.js

      - name: Validate live Cómo vamos P1/P2 results and P3 trace against Azure PostgreSQL
        run: node scripts/validate-como-vamos-api.js

      - name: Validate anonymous MCP, SALES P1, P2 determinism and P3 trace against Azure PostgreSQL
        run: MCP_URL="$APP_URL/api/mcp" node scripts/validate-motor-test-azure-p2-p3.js
