name: Validate anonymous motor-test MCP against Azure PostgreSQL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Azure database secret is configured
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${AZURE_DATABASE_URL:-}" ]] || { echo "::error::AZURE_DATABASE_URL is missing from Production"; exit 1; }
          echo "AZURE_DATABASE_URL is configured; its value is not printed."

      - name: Install MCP and PostgreSQL test dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts @modelcontextprotocol/sdk@1.26.0 zod@3.25.76 pg@8.16.3

      - name: Validate anonymous local MCP, SALES P1, deterministic P2 and P3 trace
        run: node scripts/validate-motor-test-azure-p2-p3.js
