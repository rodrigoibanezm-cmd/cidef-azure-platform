name: Deploy Inteligencia Comercial to Azure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Azure login using existing OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Promote current staging image to production
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --yes
          IMAGE=$(az containerapp show \
            --resource-group rg-cidef-prod \
            --name cidef-intel-comercial-staging \
            --query 'properties.template.containers[0].image' -o tsv)
          [[ "$IMAGE" == cidefprodacr.azurecr.io/cidef-inteligencia-comercial-staging:* ]] || {
            echo "::error::Unexpected staging image: $IMAGE"
            exit 1
          }
          echo "Promoting staging image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          az containerapp update \
            --resource-group rg-cidef-prod \
            --name cidef-inteligencia-comercial \
            --image "$IMAGE" \
            --set-env-vars PROJECTIONS_ENVIRONMENT=production \
            --output none
          DEPLOYED=$(az containerapp show \
            --resource-group rg-cidef-prod \
            --name cidef-inteligencia-comercial \
            --query 'properties.template.containers[0].image' -o tsv)
          [[ "$DEPLOYED" == "$IMAGE" ]] || { echo "::error::Production image mismatch"; exit 1; }
          echo "Production now uses the same image as staging." >> "$GITHUB_STEP_SUMMARY"
