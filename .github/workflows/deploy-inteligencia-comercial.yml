name: Deploy Inteligencia Comercial to Azure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-inteligencia-comercial.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Azure login using existing OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Checkout public frontend repository
        uses: actions/checkout@v4
        with:
          repository: rodrigoibanezm-cmd/cidef-inteligencia-comercial
          ref: main
          path: frontend
          persist-credentials: false

      - name: Record frontend source revision
        shell: bash
        run: |
          echo "Frontend source commit: $(git -C frontend rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push frontend image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="cidefprodacr.azurecr.io/cidef-inteligencia-comercial:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az acr login --name cidefprodacr
          docker build -f frontend/Dockerfile -t "$IMAGE" frontend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Image: `$IMAGE`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy frontend to existing Azure Container Apps environment
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes
          RG="rg-cidef-prod"
          APP="cidef-inteligencia-comercial"
          if ! az containerapp show -g "$RG" -n "$APP" --output none 2>/dev/null; then
            echo "::error::Expected existing Container App $APP in $RG was not found; refusing to create infrastructure."
            exit 1
          fi
          az containerapp update -g "$RG" -n "$APP" --image "$IMAGE" --output none
          FQDN=$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)
          test -n "$FQDN"
          echo "FRONT_URL=https://$FQDN" >> "$GITHUB_ENV"
          echo "Front URL: https://$FQDN" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 8 --retry-delay 5 --retry-connrefused "$FRONT_URL/" --output /dev/null
          curl --fail --show-error --location --retry 8 --retry-delay 5 "$FRONT_URL/cierre-mensual" --output /dev/null
          curl --fail --show-error --location --retry 8 --retry-delay 5 "$FRONT_URL/como-vamos" --output /dev/null
          curl --fail --show-error --location --retry 8 --retry-delay 5 "$FRONT_URL/proyeccion-semanal.html?verify=$GITHUB_RUN_ID" --output /tmp/proyeccion-semanal.html
          curl --fail --show-error --location --retry 8 --retry-delay 5 "$FRONT_URL/proyeccion-admin.html?verify=$GITHUB_RUN_ID" --output /tmp/proyeccion-admin.html
          curl --fail --show-error --location --retry 8 --retry-delay 5 "$FRONT_URL/api/health/database" --output /dev/null
          curl --fail --show-error --location --retry 8 --retry-delay 5 "$FRONT_URL/api/weekly-projections/sucursales" --output /dev/null
          curl --fail --show-error --location --retry 8 --retry-delay 5 "$FRONT_URL/api/weekly-projections/modelos" --output /dev/null
          python3 - <<'PY'
          from pathlib import Path
          weekly = Path('/tmp/proyeccion-semanal.html').read_text()
          admin = Path('/tmp/proyeccion-admin.html').read_text()
          if len(weekly) < 1000:
              raise SystemExit('Weekly projection page response is unexpectedly small')
          finance_ids = ['financeQuotes', 'financeApproved', 'financeUfi', 'financeOther']
          missing_finance_ids = [field for field in finance_ids if f'id="{field}"' not in admin]
          if missing_finance_ids:
              raise SystemExit('Restored finance cards are missing: ' + ', '.join(missing_finance_ids))
          cards = admin.count('<article class="projection-card finance-card">')
          if cards != 4:
              raise SystemExit(f'Expected the restored four finance cards, found {cards}')
          required = {
              'week selector': 'id="week"',
              'store selector': 'id="store"',
              'monthly sales trend': 'id="monthTrend"',
              'weekly sales trend': 'id="weekTrend"',
              'closed-week trend': 'id="closedTrend"',
              'next-cutoff trend': 'id="nextTrend"',
              'projection tables': '<table',
              'store breakdown': 'id="byStore"',
              'seller breakdown': 'id="sellerBreakdown"',
          }
          missing = [name for name, marker in required.items() if marker not in admin]
          if missing:
              raise SystemExit('Restored admin design is missing: ' + ', '.join(missing))
          print('Projection pages returned HTTP 200; restored four-card layout, original selectors, charts and tables are present.')
          PY
          echo "Front-only deployment verified: no database migrations or data writes were run." >> "$GITHUB_STEP_SUMMARY"
          echo "Home, existing pages, projections pages, Azure PostgreSQL health and read-only branch/model endpoints responded." >> "$GITHUB_STEP_SUMMARY"

