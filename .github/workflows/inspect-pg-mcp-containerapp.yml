name: Inspect existing CIDEF MCP Container App

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - name: Azure login via existing OIDC identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect target Container App (read only)
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_ID='/subscriptions/dba499a9-0b55-4b1c-ae5d-5063ef57ac82/resourceGroups/rg-cidef-prod/providers/Microsoft.App/containerApps/cidef-pg-mcp'
          az account set --subscription dba499a9-0b55-4b1c-ae5d-5063ef57ac82
          az resource show --ids "$RESOURCE_ID" --query '{
            id:id,
            name:name,
            type:type,
            location:location,
            provisioningState:properties.provisioningState,
            runningStatus:properties.runningStatus,
            fqdn:properties.configuration.ingress.fqdn,
            ingressExternal:properties.configuration.ingress.external,
            ingressTargetPort:properties.configuration.ingress.targetPort,
            activeRevisionsMode:properties.configuration.activeRevisionsMode,
            latestRevisionName:properties.latestRevisionName,
            latestReadyRevisionName:properties.latestReadyRevisionName,
            latestRevisionFqdn:properties.latestRevisionFqdn,
            minReplicas:properties.template.scale.minReplicas,
            maxReplicas:properties.template.scale.maxReplicas,
            image:properties.template.containers[0].image
          }' --output json
          echo '--- Revision health ---'
          az containerapp revision list --resource-group rg-cidef-prod --name cidef-pg-mcp --query '[].{
            name:name,
            active:properties.active,
            healthState:properties.healthState,
            runningState:properties.runningState,
            replicas:properties.replicas,
            createdTime:properties.createdTime
          }' --output json
          echo '--- Live readiness/OAuth checks (no credentials) ---'
          FQDN=$(az containerapp show --resource-group rg-cidef-prod --name cidef-pg-mcp --query properties.configuration.ingress.fqdn --output tsv)
          if [[ -z "$FQDN" ]]; then echo "::error::No public FQDN returned"; exit 1; fi
          echo "public_host=$FQDN"
          curl --max-time 15 -fsS "https://$FQDN/readyz"
          echo
          METADATA_STATUS=$(curl --max-time 15 -s -o /dev/null -w '%{http_code}' "https://$FQDN/.well-known/oauth-protected-resource")
          MCP_STATUS=$(curl --max-time 15 -s -o /dev/null -w '%{http_code}' "https://$FQDN/mcp")
          echo "oauth_metadata_http_status=$METADATA_STATUS"
          echo "unauthenticated_mcp_http_status=$MCP_STATUS"
          [[ "$METADATA_STATUS" == '200' && "$MCP_STATUS" == '401' ]] || {
            echo "::error::MCP OAuth endpoint checks failed"
            exit 1
          }
