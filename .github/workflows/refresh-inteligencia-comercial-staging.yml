name: Refresh Inteligencia Comercial results (staging)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-projection-results-staging
  cancel-in-progress: false

jobs:
  refresh-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Detect certified SALES or FORUM publication and refresh only changed sources
        env:
          BASE_URL: https://cidef-intel-comercial-staging.calmforest-1c67ab46.chilecentral.azurecontainerapps.io
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';
          // Both existing legacy workflows publish forum_ventas_snapshot_v01 READY
          // after their successful Azure load. The API verifies that marker itself.
          // No cross-repository token, RAW scan or commercial calculation on polling.
          const base = process.env.BASE_URL;
          if (base !== 'https://cidef-intel-comercial-staging.calmforest-1c67ab46.chilecentral.azurecontainerapps.io') throw new Error('STAGING_ONLY');
          const api = base + '/api/weekly-projections/results';
          const read = async () => {
            const response = await fetch(api + '?status=1&sources=1', { signal: AbortSignal.timeout(30000), cache: 'no-store' });
            const state = await response.json();
            if (!response.ok || !state.ok || state.environment !== 'staging') throw new Error(state.error || 'STAGING_SNAPSHOT_API_NOT_READY');
            return state;
          };
          const summary = async text => {
            console.log(text);
            if (process.env.GITHUB_STEP_SUMMARY) await appendFile(process.env.GITHUB_STEP_SUMMARY, text + '\n');
          };
          const before = await read();
          if (!before.snapshot_version) {
            await summary('Staging deployment pending. Automatic generation is deferred until the new API is available.');
            process.exit(0);
          }
          const source = before.source_state;
          if (source?.status !== 'READY') {
            await summary('Sources deferred: ' + (source?.status || 'UNAVAILABLE') + '. The previous snapshot is retained.');
            process.exit(0);
          }
          if (before.status === 'running') {
            await summary('A live staging refresh already owns the lease. No duplicate calculation.');
            process.exit(0);
          }
          if (before.status === 'completed' && before.sources?.generation_id === source.generation_id &&
              before.version === before.snapshot_version) {
            await summary('Certified publication already processed: ' + source.generation_id + '. No recalculation.');
            process.exit(0);
          }
          // Do not rely on the long POST connection staying open through Azure ingress.
          let postOutcome;
          const post = fetch(api, { method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ automatic: true }), signal: AbortSignal.timeout(220000) })
            .then(async response => { postOutcome = { status: response.status, data: await response.json() }; })
            .catch(error => { postOutcome = { error: error.message }; });
          for (let attempt = 0; attempt < 440; attempt++) {
            await new Promise(resolve => setTimeout(resolve, 15000));
            let state;
            try { state = await read(); } catch (error) { console.log('Read retry: ' + error.message); continue; }
            const ours = Boolean(state.job_id) && state.job_id !== before.job_id;
            if (ours && state.status === 'completed') {
              await summary('Staging snapshot ' + state.cutoff_date + ' (week ' + state.week_start + '): ' +
                (state.skipped ? 'sources unchanged; publication recorded without recalculation' : 'published atomically') +
                '. SALES cutoff ' + state.sources.sales_cutoff + '; FORUM cutoff ' + state.sources.forum_cutoff +
                '; source execution ' + state.sources.generation_id + '.');
              const getResult = async suffix => {
                const response = await fetch(api + suffix, { signal: AbortSignal.timeout(30000), cache: 'no-store' });
                const result = await response.json();
                if (!response.ok || !result.ok) throw new Error(result.error || 'SNAPSHOT_READ_FAILED');
                return result;
              };
              const company = await getResult('');
              const storeId = company.storeSales?.[0]?.sucursal_id;
              if (!storeId) throw new Error('SNAPSHOT_STORE_MISSING');
              const store = await getResult('?sucursal_id=' + encodeURIComponent(storeId));
              const again = await getResult('');
              if (![company,store,again].every(result => result.snapshot?.generation_id === company.snapshot.generation_id &&
                  Array.isArray(result.admin?.projections) && Array.isArray(result.admin?.sent_not_invoiced))) throw new Error('SNAPSHOT_NAVIGATION_FAILED');
              await summary('Read-only company → store → company validation PASS; live projection and sent-not-invoiced arrays present.');
              await post;
              process.exit(0);
            }
            if (ours && ['failed', 'expired'].includes(state.status)) throw new Error(state.error || 'REFRESH_LEASE_EXPIRED');
            if (postOutcome?.status >= 400) throw new Error(postOutcome.data?.error || 'REFRESH_REQUEST_FAILED');
            if (postOutcome?.data?.status === 'running' && !postOutcome.data.claimed) {
              await summary('Another refresh claimed the staging lease. No duplicate calculation.');
              process.exit(0);
            }
            if (postOutcome?.error && !ours) throw new Error(postOutcome.error);
          }
          throw new Error('REFRESH_TIMEOUT: next scheduled run recovers the expired lease; previous snapshot retained.');
          NODE
