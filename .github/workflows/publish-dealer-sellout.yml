name: Publish dealer sell-out snapshot
on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish-dealer-sellout.js'
      - 'lib/data-floor/refreshDealerSellout.js'
      - '.github/workflows/publish-dealer-sellout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 10
    env:
      AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --ignore-scripts
      - name: Materialize monthly dealer sell-out
        run: node scripts/publish-dealer-sellout.js
