name: Verify FORUM P1 on Azure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/forum-snapshot/**'
      - 'scripts/refresh-forum-ventas-snapshot-azure.js'
      - 'test/forum-snapshot-incremental.test.js'
      - '.github/workflows/verify-forum-p1.yml'

permissions:
  contents: read

jobs:
  verify-forum-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Validate FORUM P1 semantics
        run: node --test test/forum-p1-semantics.test.js
      - name: Compare September 2026 FORUM P1 against certified Neon baseline
        env:
          AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AZURE_DATABASE_URL:-}" ]]; then
            echo "::error::AZURE_DATABASE_URL is not configured in Production"
            exit 1
          fi
          node scripts/verify-forum-p1.js
      - name: Test incremental invalidation, parity and rollback
        if: ${{ !cancelled() }}
        run: node --test test/forum-ventas-snapshot.test.js test/forum-snapshot-incremental.test.js
      - name: Compare full and incremental Forum snapshots without publishing
        if: ${{ !cancelled() }}
        env:
          AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
          DATABASE_URL: ''
          POSTGRES_URL: ''
          FORUM_SNAPSHOT_REPORT: forum-snapshot-parity.json
        run: node scripts/refresh-forum-ventas-snapshot-azure.js --compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum-snapshot-parity
          path: forum-snapshot-parity.json
          if-no-files-found: ignore
