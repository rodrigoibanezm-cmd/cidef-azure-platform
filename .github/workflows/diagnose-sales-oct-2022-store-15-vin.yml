name: Diagnose October 2022 SALES VIN difference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-vin:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    env:
      AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install runtime dependency
        run: npm install --no-save --no-package-lock --ignore-scripts pg@8.16.3

      - name: Diagnose VIN, invoice, branch and credit-note records
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AZURE_DATABASE_URL:-}" ]]; then
            echo "::error::AZURE_DATABASE_URL is not configured in the Production environment"
            exit 1
          fi
          node scripts/diagnose-sales-oct-2022-store-15-vin.js
