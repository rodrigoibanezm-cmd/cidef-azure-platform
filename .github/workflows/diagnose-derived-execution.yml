name: Diagnose failed derived execution (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect failed replica and system events
        shell: bash
        run: |
          set -euo pipefail
          RG=rg-cidef-prod
          JOB=cidef-data-loader-job
          EXEC=cidef-data-loader-job-npf9oyr
          ID=$(az containerapp job show -g "$RG" -n "$JOB" --query id -o tsv)
          echo '=== Execution status and replica details ==='
          az rest --method GET --url "https://management.azure.com${ID}/executions/${EXEC}?api-version=2025-07-01" \
            --query '{name:name,properties:properties}' --output json
          echo '=== Job timeout and resources ==='
          az containerapp job show -g "$RG" -n "$JOB" \
            --query '{timeout:properties.configuration.replicaTimeout,retry:properties.configuration.replicaRetryLimit,containers:properties.template.containers[].{name:name,resources:resources}}' -o json
          echo '=== Azure console tail (stdout and stderr, read-only) ==='
          ENV_ID=$(az containerapp job show -g "$RG" -n "$JOB" --query 'properties.environmentId' -o tsv)
          WORKSPACE=$(az rest --method GET --url "https://management.azure.com${ENV_ID}?api-version=2024-03-01" --query 'properties.appLogsConfiguration.logAnalyticsConfiguration.customerId' -o tsv)
          [[ "$WORKSPACE" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'Log Analytics workspace not found'; exit 1; }
          # Query only this historical execution. Show terminal lines in chronological order.
          CONSOLE_QUERY="union isfuzzy=true ContainerAppConsoleLogs_CL, ContainerAppConsoleLogs
          | extend Pod=tostring(column_ifexists('ContainerGroupName_s', column_ifexists('ContainerGroupName',''))),
                   Stream=tostring(column_ifexists('Stream_s',column_ifexists('Stream',''))),
                   Msg=tostring(column_ifexists('Log_s',column_ifexists('Log','')))
          | where TimeGenerated between(datetime(2026-11-26T15:08:00Z)..datetime(2026-11-26T15:50:00Z))
          | where Pod contains 'npf9oyr'
          | project TimeGenerated, Pod, Stream, Msg
          | top 180 by TimeGenerated desc
          | order by TimeGenerated asc"
          az monitor log-analytics query --workspace "$WORKSPACE" --analytics-query "$CONSOLE_QUERY" -o json
          echo '=== Console errors across the entire execution ==='
          ERROR_QUERY="union isfuzzy=true ContainerAppConsoleLogs_CL, ContainerAppConsoleLogs
          | extend Pod=tostring(column_ifexists('ContainerGroupName_s',column_ifexists('ContainerGroupName',''))),
                   Stream=tostring(column_ifexists('Stream_s',column_ifexists('Stream',''))),
                   Msg=tostring(column_ifexists('Log_s',column_ifexists('Log','')))
          | where TimeGenerated between(datetime(2026-11-26T15:08:00Z)..datetime(2026-11-26T15:50:00Z))
          | where Pod contains 'npf9oyr'
          | where Stream =~ 'stderr' or Msg has_any ('FAILED','ERROR','SNAPSHOT_NOT_PUBLISHED','P1_RECONCILED','SNAPSHOT_PUBLISHED','SIGTERM','SIGKILL','FATAL')
          | project TimeGenerated, Stream, Msg
          | order by TimeGenerated asc
          | take 160"
          az monitor log-analytics query --workspace "$WORKSPACE" --analytics-query "$ERROR_QUERY" -o json
          echo '=== System events for this replica ==='
          SYSTEM_QUERY="union isfuzzy=true ContainerAppSystemLogs_CL, ContainerAppSystemLogs
          | extend Pod=tostring(column_ifexists('ContainerGroupName_s',column_ifexists('ContainerGroupName',''))),
                   Msg=tostring(column_ifexists('Log_s',column_ifexists('Log','')))
          | where TimeGenerated between(datetime(2026-11-26T15:08:00Z)..datetime(2026-11-26T15:50:00Z))
          | where Pod contains 'npf9oyr' or Msg contains 'npf9oyr'
          | project TimeGenerated,Pod,Msg
          | order by TimeGenerated asc
          | take 100"
          az monitor log-analytics query --workspace "$WORKSPACE" --analytics-query "$SYSTEM_QUERY" -o json
          echo 'Read-only diagnosis complete'
