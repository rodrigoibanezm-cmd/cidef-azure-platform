name: Initialize Azure P3 schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    env:
      AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PostgreSQL driver
        run: npm install --no-save --no-package-lock --ignore-scripts pg@8.16.3

      - name: Initialize P3 schema in Azure
        run: node scripts/initialize-p3-azure.js

      - name: Verify P3 schema using the existing read-only validator
        run: node scripts/validate-azure-postgres-adapter.js
