name: Cargar histórico Dealers por modelo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  load:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 60
    env:
      AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias existentes
        run: npm install --no-save --no-package-lock --ignore-scripts pg@8.16.3
      - name: Cargar snapshots por dealer y modelo
        run: |
          test -n "$AZURE_DATABASE_URL"
          node scripts/publish-dealer-monthly-model-sellin.js
