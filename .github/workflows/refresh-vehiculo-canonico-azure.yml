name: Refresh vehiculo canonico Azure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 30
    env:
      AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --ignore-scripts
      - name: Refresh canonical once
        run: |
          node --input-type=module <<'EOF'
          import { refreshVehiculoCanonicoV01 } from './lib/canonical/refresh-vehiculo-canonico-v01.js';
          import { getAzurePool, closeAzurePool, azureCompatibleSql } from './lib/azure-postgres.js';

          const client = await getAzurePool().connect();
          try {
            await client.query('BEGIN');
            const execute = async (sql, params = []) =>
              (await client.query(azureCompatibleSql(sql), params)).rows;
            const result = await refreshVehiculoCanonicoV01({ execute });
            await client.query('COMMIT');
            console.log(JSON.stringify({ base: result.base, rvm_dates_updated: result.rvm_dates_updated }, null, 2));
          } catch (error) {
            await client.query('ROLLBACK');
            throw error;
          } finally {
            client.release();
            await closeAzurePool();
          }
          EOF
