name: Validate SALES declarative SQL-first opt-in (isolated)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate P1 full vs partial declarative evidence
        env:
          AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
          SALES_SQL_FIRST_ENABLED: 'false'
        run: node scripts/validate-sales-declarative-optin.mjs

# No deployment, Container App update, or persistent flag change.
