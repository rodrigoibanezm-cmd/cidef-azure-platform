name: Validate SALES declarative SQL-first opt-in (isolated)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/validate-sales-declarative-optin.mjs'
      - '.github/workflows/validate-sales-declarative-optin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund zod@3.25.76
      - name: Compare P1 complete vs SQL-first VIN-by-VIN
        env:
          AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
          SALES_SQL_FIRST_ENABLED: 'false'
        run: node scripts/validate-sales-declarative-optin.mjs

# No deployment, Container App update, or persistent flag change.
