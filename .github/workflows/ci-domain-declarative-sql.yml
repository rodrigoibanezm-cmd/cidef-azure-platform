name: CI domain declarative SQL

on:
  push:
    branches: [main]
    paths:
      - 'lib/data-floor/registry.js'
      - 'lib/data-floor/inventoryCertifier.js'
      - 'lib/data-floor/selloutCertifier.js'
      - 'lib/data-floor/targetsCertifier.js'
      - 'lib/data-floor/pricingCertifier.js'
      - 'test/domain-declarative-sql.test.mjs'
      - '.github/workflows/ci-domain-declarative-sql.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check lib/data-floor/inventoryCertifier.js
          node --check lib/data-floor/selloutCertifier.js
          node --check lib/data-floor/targetsCertifier.js
          node --check lib/data-floor/pricingCertifier.js
          node --check lib/data-floor/registry.js
      - name: Run isolated adapter and SQL tests
        run: node --test test/domain-declarative-sql.test.mjs
# No database access, deploy, or production writes.
