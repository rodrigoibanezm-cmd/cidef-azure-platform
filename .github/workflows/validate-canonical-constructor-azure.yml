name: Validate Canonical Constructor Azure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 10
    env:
      AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --ignore-scripts
      - name: Check imported modules
        run: |
          node --check lib/canonical/vehiculo-salida-v01.js
          node --check lib/canonical/refresh-vehiculo-canonico-v01.js
      - name: Diagnose canonical builder (read-only)
        run: |
          node --input-type=module <<'EOF'
          import { refreshVehiculoCanonicoV01 } from './lib/canonical/refresh-vehiculo-canonico-v01.js';
          import { closeAzurePool } from './lib/azure-postgres.js';
          try {
            const result = await refreshVehiculoCanonicoV01({ dry_run: true });
            console.log(JSON.stringify(result, null, 2));
          } finally {
            await closeAzurePool();
          }
          EOF

      - name: Verify RVM parity and commercial identities (read-only)
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { getAzurePool, closeAzurePool } from './lib/azure-postgres.js';
          const db = getAzurePool();
          try {
            const { rows: [audit] } = await db.query(`
              SELECT
                (SELECT count(*) FROM public.vehiculo_canonico) AS canonical_vins,
                (SELECT count(*) FROM public.vehiculo_canonico WHERE dealer_id IS NOT NULL) AS dealer_assigned,
                (SELECT count(*) FROM public.vehiculo_canonico WHERE canal_salida='DEALER' AND dealer_id IS NULL) AS dealer_unresolved,
                (SELECT max(fecha_inscripcion_rvm) FROM public.vehiculo_canonico) AS latest_canonical_rvm,
                (SELECT count(*) FROM public.vehiculo_canonico WHERE fecha_inscripcion_rvm >= DATE '2026-10-01') AS october_rvm,
                (SELECT count(*) FROM public.vehiculos_raw r JOIN public.vehiculo_canonico c
                   ON c.vin=upper(btrim(r.vin_chasis))
                   WHERE r.fecha_inscripcion_rvm IS NOT NULL
                     AND c.fecha_inscripcion_rvm IS DISTINCT FROM r.fecha_inscripcion_rvm) AS rvm_mismatch
            `);
            console.log(JSON.stringify(audit, null, 2));
            if (Number(audit.rvm_mismatch) !== 0) throw new Error('RVM mismatch: cannot enable rebuild');
          } finally {
            await closeAzurePool();
          }
          EOF

      - name: Preview commercial identity impact (read-only)
        run: |
          node --input-type=module <<'EOF'
          import { refreshVehiculoSalidaV01 } from './lib/canonical/vehiculo-salida-v01.js';
          import { getAzurePool, closeAzurePool } from './lib/azure-postgres.js';
          try {
            const [current] = (await getAzurePool().query(`
              SELECT count(*) FILTER (WHERE dealer_id IS NOT NULL)::int AS dealer_assigned,
                     count(*) FILTER (WHERE canal_salida='DEALER')::int AS dealers,
                     count(*) FILTER (WHERE vendido)::int AS sold
              FROM public.vehiculo_canonico
            `)).rows;
            const { preview } = await refreshVehiculoSalidaV01({ dry_run: true });
            console.log(JSON.stringify({ current, predicted: preview }, null, 2));
            if (Number(preview.dealer) < Number(current.dealers) ||
                Number(preview.vendidos) < Number(current.sold)) {
              throw new Error('Legacy reconstruction would reduce existing commercial classifications; writing remains blocked');
            }
          } finally {
            await closeAzurePool();
          }
          EOF
