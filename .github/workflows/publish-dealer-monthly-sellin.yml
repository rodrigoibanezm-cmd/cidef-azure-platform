name: Publish dealers monthly sell-in snapshot
on:
  workflow_dispatch:
    inputs:
      snapshot_type:
        description: 'brand (actual) o model (histórico por modelo)'
        required: true
        default: 'brand'
        type: choice
        options:
          - brand
          - model
      year:
        description: 'Sales year'
        required: true
        default: '2026'
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 60
    env:
      AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
      SELLIN_YEAR: ${{ inputs.year }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing P1 dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts pg@8.16.3
      - name: Check script syntax
        run: node --check scripts/publish-dealer-monthly-sellin.js
      - name: Publish brand snapshots
        if: inputs.snapshot_type == 'brand'
        run: |
          test -n "$AZURE_DATABASE_URL"
          node scripts/publish-dealer-monthly-sellin.js
      - name: Publish model snapshots
        if: inputs.snapshot_type == 'model'
        run: |
          test -n "$AZURE_DATABASE_URL"
          node scripts/publish-dealer-monthly-model-sellin.js
