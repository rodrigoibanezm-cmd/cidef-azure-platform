name: Correct P4 MCP endpoint
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  correct:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify endpoint and update only MCP_URL
        run: python scripts/correct-p4-mcp-url.py
