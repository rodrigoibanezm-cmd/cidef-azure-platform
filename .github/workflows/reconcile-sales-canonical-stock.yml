name: Reconcile SALES canonical inside Azure Container Job
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: cidef-sales-canonical-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build existing SALES runtime image (no app deployment)
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name cidefprodacr
          IMAGE="cidefprodacr.azurecr.io/cidef-data-loader:canonical-${GITHUB_SHA::12}"
          docker build -f Dockerfile.sales-refresh -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Start existing Azure Job with canonical-only override and verify outcome
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(cat <<'JS'
          import {getAzurePool, closeAzurePool, azureCompatibleSql} from './lib/azure-postgres.js';
          import {refreshVehiculoCanonicoV01} from './lib/canonical/refresh-vehiculo-canonico-v01.js';
          const pool=getAzurePool(), client=await pool.connect();
          const lock='cidef_ventas_raw_neon_azure_sync';
          let locked=false, transaction=false;
          const execute=(q,p=[])=>client.query(azureCompatibleSql(q),p).then(r=>r.rows);
          try {
            const [{ok}]=await execute('SELECT pg_try_advisory_lock(hashtext($1)) AS ok',[lock]);
            if(!ok) throw Error('SALES_REFRESH_ALREADY_RUNNING');
            locked=true;
            await client.query('BEGIN');transaction=true;
            await client.query("SET LOCAL statement_timeout = '600s'");
            const preview=await refreshVehiculoCanonicoV01({dry_run:true,execute});
            if(Number(preview.before.canonical_extra_before)!==0) throw Error('CANONICAL_PREFLIGHT_FAILED');
            const result=await refreshVehiculoCanonicoV01({dry_run:false,execute});
            if(Number(result.base.rows_deleted)!==0) throw Error('CANONICAL_DELETED_VINS');
            const {rows}=await client.query(`SELECT c.vin,c.vendido,v.vigente,v.esta_reservado,
              v.numero_factura,v.fecha_factura FROM public.vehiculo_canonico c
              JOIN public.vehiculos_raw v ON upper(btrim(v.vin_chasis))=c.vin
              WHERE c.vin=ANY($1::text[])`,[['LVAV2AVB8TE322187','LVAV2JVB4TE322929']]);
            const old=rows.find(r=>r.vin==='LVAV2AVB8TE322187');
            const replacement=rows.find(r=>r.vin==='LVAV2JVB4TE322929');
            if(!old||old.vendido!==false||!replacement||replacement.vendido!==true)
              throw Error('CANONICAL_VIN_VALIDATION_FAILED');
            await client.query('COMMIT');transaction=false;
            console.log(JSON.stringify({status:'COMMITTED',canonical_rows:result.base.rows_upserted,vins:rows}));
          }catch(e){
            if(transaction) await client.query('ROLLBACK').catch(()=>{});
            console.error(JSON.stringify({status:'ROLLED_BACK',error:e.message,code:e.code}));
            process.exitCode=1;
          }finally{
            if(locked)await client.query('SELECT pg_advisory_unlock(hashtext($1))',[lock]).catch(()=>{});
            client.release();await closeAzurePool();
          }
          JS
          )
          export CODE
          RESOURCE="/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-cidef-prod/providers/Microsoft.App/jobs/cidef-data-loader-job"
          API="2024-03-01"
          az rest --method get --url "https://management.azure.com${RESOURCE}?api-version=${API}" > job.json
          python3 - <<'PY'
          import copy,json,os
          job=json.load(open('job.json'))
          assert job['properties']['configuration']['triggerType']=='Manual'
          template=job['properties']['template']
          assert len(template['containers'])==1
          container=copy.deepcopy(template['containers'][0])
          container['image']=os.environ['IMAGE']
          container['command']=['node']
          container['args']=['--input-type=module','-e',os.environ['CODE']]
          container['env']=[e for e in container.get('env',[]) if e['name']!='CIDEF_ADMIN_EXECUTION_ID']
          override={'containers':[container]}
          if template.get('initContainers'): override['initContainers']=template['initContainers']
          json.dump(override,open('override.json','w'))
          PY
          az rest --method post --url "https://management.azure.com${RESOURCE}/start?api-version=${API}" --headers 'Content-Type=application/json' --body @override.json > execution.json
          EXECUTION=$(python3 -c "import json; j=json.load(open('execution.json')); print(j.get('name') or j['id'].split('/')[-1])")
          test -n "$EXECUTION"
          echo "Azure execution: $EXECUTION"
          echo "Azure Container Job execution: $EXECUTION" >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 90); do
            STATUS=$(az containerapp job execution show --name "$EXECUTION" --job-name cidef-data-loader-job --resource-group rg-cidef-prod --query properties.status -o tsv 2>/dev/null || true)
            case "$STATUS" in
              Succeeded) echo 'Canonical reconciliation succeeded'; exit 0 ;;
              Failed|Canceled|Cancelled) echo "::error::Canonical Azure Job ended: $STATUS"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Azure Job did not reach a terminal status within 15 minutes"
          exit 1
