name: Validate P4 research end to end
on:
  workflow_dispatch:
    inputs:
      period:
        description: Closed commercial month (YYYY-MM)
        required: true
        type: string
      model:
        description: Optional override (blank uses existing Azure model)
        required: false
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  research:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      PERIOD: ${{ inputs.period }}
      MODEL_OVERRIDE: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: pip install -r monthly_close_agent/requirements.txt
      - name: Run isolated research using existing Azure P4 configuration
        run: python scripts/validate-p4-azure.py
