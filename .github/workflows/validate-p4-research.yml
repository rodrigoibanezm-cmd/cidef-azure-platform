name: Validate P4 research end to end
on:
  workflow_dispatch:
    inputs:
      mcp_only:
        description: Diagnose MCP only (no OpenAI API usage)
        type: boolean
        default: true
      question:
        description: Any complex commercial question (only for full research)
        required: false
        type: string
      research_goal:
        description: Why adaptive investigation is needed (only for full research)
        required: false
        type: string
      budget_usd:
        description: Maximum estimated USD per research
        type: string
        default: '0.50'
      model:
        description: Optional override (blank uses existing Azure model)
        required: false
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  research:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      P4_BUDGET_USD: ${{ inputs.budget_usd }}
      P4_MODEL_RATES_JSON: ${{ vars.P4_MODEL_RATES_JSON }}
      MCP_ONLY: ${{ inputs.mcp_only }}
      QUESTION: ${{ inputs.question }}
      RESEARCH_GOAL: ${{ inputs.research_goal }}
      MODEL_OVERRIDE: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: pip install -r monthly_close_agent/requirements.txt
      - name: Run isolated research using existing Azure P4 configuration
        run: python scripts/validate-p4-azure.py
