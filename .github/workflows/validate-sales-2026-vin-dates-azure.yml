name: Validate SALES 2026 VIN dates in Azure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sales-vin-dates:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL driver
        run: npm install --no-save --no-package-lock --ignore-scripts pg@8.16.3
      - name: Syntax-check validator
        run: node --check scripts/validate-sales-2026-vin-dates-azure.js
      - name: Validate certified VIN dates using Azure (read-only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AZURE_DATABASE_URL:-}" ]]; then
            echo "::error::Missing AZURE_DATABASE_URL in the Production environment"
            exit 1
          fi
          node scripts/validate-sales-2026-vin-dates-azure.js
