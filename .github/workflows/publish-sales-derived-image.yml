name: Preparar imagen SALES derivadas
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Validar ejecutor sin conectarse a Azure PostgreSQL
        run: |
          node --check scripts/refresh-sales-derived-azure.js
          grep -q 'COPY scripts/refresh-sales-sources-azure.js scripts/refresh-sales-derived-azure.js' Dockerfile.sales-refresh
      - name: Autenticar en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Construir y publicar imagen sin ejecutar Job
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name cidefprodacr
          IMAGE="cidefprodacr.azurecr.io/cidef-data-loader:sales-derived-${GITHUB_SHA::12}"
          docker build -f Dockerfile.sales-refresh -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Imagen preparada (sin despliegue ni ejecución): $IMAGE"
