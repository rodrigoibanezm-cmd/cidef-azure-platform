name: Deploy PostgreSQL MCP to Azure

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'lib/**'
      - 'scripts/verify-sales-p1.js'
      - 'scripts/verify-rvm-p1.js'
      - 'scripts/verify-crm-p1.js'
      - 'scripts/verify-forum-p1.js'
      - 'scripts/install-forum-universe-view.js'
      - 'scripts/forum-raw-inventory.js'
      - 'scripts/recover-forum-snapshots-azure.js'
      - 'Dockerfile.pg-mcp'
      - '.github/workflows/deploy-pg-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push MCP image
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name cidefprodacr
          IMAGE="cidefprodacr.azurecr.io/cidef-postgres-mcp:${GITHUB_SHA}"
          docker build --file Dockerfile.pg-mcp --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Recover missing FORUM snapshots from the R2 mirror in Azure Blob
        id: forum_recovery
        env:
          AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK_DIR=$(mktemp -d)
          mkdir -p "$WORK_DIR/files"
          az storage blob list \
            --account-name cidefprodstorage \
            --container-name cidef \
            --auth-mode key \
            --prefix Forum/ \
            --output json > "$WORK_DIR/blob-list.json"
          docker run --rm \
            --entrypoint node \
            -e AZURE_DATABASE_URL="$AZURE_DATABASE_URL" \
            "$IMAGE" scripts/forum-raw-inventory.js > "$WORK_DIR/azure-raw.json"
          python3 - "$WORK_DIR/blob-list.json" "$WORK_DIR/azure-raw.json" "$WORK_DIR/manifest.json" "$WORK_DIR/manifest.tsv" <<'PY'
          import json
          import re
          import sys

          blob_path, raw_path, manifest_path, tsv_path = sys.argv[1:]
          blobs = json.load(open(blob_path, encoding="utf-8"))
          raw = json.load(open(raw_path, encoding="utf-8"))
          patterns = {
              "COTIZACION": re.compile(r"^Forum/Cotizacion_Cidef_(\d{4})(\d{2})(\d{2})\.csv$"),
              "PRECURSE": re.compile(r"^Forum/Precurse_Cidef_(\d{4})(\d{2})(\d{2})\.csv$"),
              "CURSE": re.compile(r"^Forum/Curse_Cidef_(\d{4})(\d{2})(\d{2})\.csv$"),
          }
          coverage = {(r["snapshot_date"], r["source_type"]): int(r["rows"]) for r in raw}
          candidates = []
          for blob in blobs:
              name = blob.get("name", "")
              for source_type, pattern in patterns.items():
                  match = pattern.fullmatch(name)
                  if not match:
                      continue
                  date = "-".join(match.groups())
                  if coverage.get((date, source_type), 0) == 0:
                      candidates.append({"snapshot_date": date, "source_type": source_type, "blob_name": name, "file": "/forum_recovery/files/" + name.split("/")[-1]})
          candidates.sort(key=lambda x: (x["snapshot_date"], x["source_type"]))
          with open(manifest_path, "w", encoding="utf-8") as f:
              json.dump(candidates, f)
          with open(tsv_path, "w", encoding="utf-8") as f:
              for item in candidates:
                  f.write(item["snapshot_date"] + "\t" + item["source_type"] + "\t" + item["blob_name"] + "\n")
          print(json.dumps({"available_forum_csvs": sum(1 for b in blobs if b.get("name", "").endswith(".csv")), "forum_mirror_files_to_compare": candidates}))
          PY

          while IFS=$'\t' read -r snapshot_date source_type blob_name; do
            [[ -n "$blob_name" ]] || continue
            filename="${blob_name##*/}"
            echo "Downloading original R2 mirror file: $blob_name ($snapshot_date $source_type)"
            az storage blob download \
              --account-name cidefprodstorage \
              --container-name cidef \
              --auth-mode key \
              --name "$blob_name" \
              --file "$WORK_DIR/files/$filename" \
              --only-show-errors \
              --output none
          done < "$WORK_DIR/manifest.tsv"

          chmod -R a+rX "$WORK_DIR"
          if [[ -s "$WORK_DIR/manifest.tsv" ]]; then
            docker run --rm \
              --entrypoint node \
              -e AZURE_DATABASE_URL="$AZURE_DATABASE_URL" \
              -v "$WORK_DIR:/forum_recovery:ro" \
              "$IMAGE" scripts/recover-forum-snapshots-azure.js /forum_recovery/manifest.json
          fi
          rm -rf "$WORK_DIR"

      - name: Verify SALES P1 against Azure PostgreSQL
        env:
          AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint node \
            -e AZURE_DATABASE_URL="$AZURE_DATABASE_URL" \
            "$IMAGE" scripts/verify-sales-p1.js

      - name: Verify RVM P1 against Neon September baseline
        env:
          AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint node \
            -e AZURE_DATABASE_URL="$AZURE_DATABASE_URL" \
            "$IMAGE" scripts/verify-rvm-p1.js

      - name: Verify CRM P1 against Neon September baseline
        env:
          AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint node \
            -e AZURE_DATABASE_URL="$AZURE_DATABASE_URL" \
            "$IMAGE" scripts/verify-crm-p1.js

      - name: Verify FORUM P1 against Neon September baseline
        env:
          AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint node \
            -e AZURE_DATABASE_URL="$AZURE_DATABASE_URL" \
            "$IMAGE" scripts/install-forum-universe-view.js
          docker run --rm \
            --entrypoint node \
            -e AZURE_DATABASE_URL="$AZURE_DATABASE_URL" \
            "$IMAGE" scripts/verify-forum-p1.js

      - name: Deploy to existing Container Apps environment
        env:
          AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
          MCP_CLIENT_ID: 71a36bc5-b850-43bf-be67-e28568ef0d58
          MCP_TENANT_ID: 1a38830c-0239-4e97-9b1d-bededd560934
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AZURE_DATABASE_URL:-}" ]]; then
            echo "::error::AZURE_DATABASE_URL is not configured in the Production environment"
            exit 1
          fi

          RG=rg-cidef-prod
          APP=cidef-pg-mcp
          ACR=cidefprodacr.azurecr.io
          az extension add --name containerapp --upgrade --yes
          IDENTITY_ID=$(az identity show --resource-group "$RG" --name id-cidef-azure-pg-mcp --query id -o tsv)
          test -n "$IDENTITY_ID"

          ACR_ID=$(az acr show --name cidefprodacr --resource-group "$RG" --query id -o tsv)
          PRINCIPAL_ID=$(az identity show --resource-group "$RG" --name id-cidef-azure-pg-mcp --query principalId -o tsv)
          test -n "$PRINCIPAL_ID"
          test -n "$ACR_ID"

          if ! az containerapp show --resource-group "$RG" --name "$APP" --output none 2>/dev/null; then
            echo "::error::Existing Container App $APP was not found; workflow will not create infrastructure"
            exit 1
          fi

          ACR_PULL_COUNT=$(az role assignment list \
            --assignee-object-id "$PRINCIPAL_ID" \
            --scope "$ACR_ID" \
            --query "[?roleDefinitionName=='AcrPull'] | length(@)" \
            --output tsv)
          if ! [[ "$ACR_PULL_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Existing AcrPull assignment was not found for id-cidef-azure-pg-mcp at $ACR_ID; no role assignment was attempted"
            exit 1
          fi
          echo "Verified existing AcrPull assignment for id-cidef-azure-pg-mcp"

          wait_for_app() {
            for attempt in {1..36}; do
              STATE=$(az containerapp show --resource-group "$RG" --name "$APP" --query properties.provisioningState --output tsv)
              if [[ "$STATE" == "Succeeded" ]]; then
                return 0
              fi
              if [[ "$STATE" == "Failed" ]]; then
                echo "::error::Container App provisioning state is Failed"
                return 1
              fi
              sleep 5
            done
            echo "::error::Container App provisioning did not finish within 180 seconds (state: $STATE)"
            return 1
          }

          APP_JSON=$(mktemp)
          PATCH_JSON=$(mktemp)
          az containerapp show --resource-group "$RG" --name "$APP" --output json > "$APP_JSON"
          python3 - "$APP_JSON" "$PATCH_JSON" "$IDENTITY_ID" "$ACR" <<'PY'
          import json
          import sys

          source, target, identity_id, acr_server = sys.argv[1:]
          with open(source, encoding="utf-8") as f:
              app = json.load(f)
          identity = app.get("identity") or {}
          identities = identity.get("userAssignedIdentities") or {}
          identities[identity_id] = {}
          identity_type = identity.get("type", "")
          identity["type"] = "SystemAssigned, UserAssigned" if "SystemAssigned" in identity_type else "UserAssigned"
          identity = {"type": identity["type"], "userAssignedIdentities": identities}

          source_configuration = app.get("properties", {}).get("configuration") or {}
          allowed_configuration = {
              "activeRevisionsMode", "dapr", "identitySettings", "ingress",
              "maxInactiveRevisions", "registries", "runtime", "service"
          }
          configuration = {
              key: value for key, value in source_configuration.items()
              if key in allowed_configuration
          }
          # The CLI response contains a convenience field not accepted by the ARM API.
          ingress = configuration.get("ingress")
          if ingress:
              ingress.pop("targetPortHttpScheme", None)
          registries = configuration.get("registries") or []
          registries = [item for item in registries if item.get("server", "").lower() != acr_server.lower()]
          registries.append({"server": acr_server, "identity": identity_id})
          configuration["registries"] = registries

          with open(target, "w", encoding="utf-8") as f:
              json.dump({"identity": identity, "properties": {"configuration": configuration}}, f)
          PY
          APP_RESOURCE_ID=$(az containerapp show --resource-group "$RG" --name "$APP" --query id -o tsv)
          az rest --method patch \
            --uri "https://management.azure.com${APP_RESOURCE_ID}?api-version=2025-07-01" \
            --body "@$PATCH_JSON" \
            --output none
          wait_for_app
          rm -f "$APP_JSON" "$PATCH_JSON"
          az containerapp update --resource-group "$RG" --name "$APP" --image "$IMAGE" --output none
          wait_for_app
          az containerapp secret set --resource-group "$RG" --name "$APP" --secrets "database-url=$AZURE_DATABASE_URL" --output none
          wait_for_app
          FQDN=$(az containerapp show --resource-group "$RG" --name "$APP" --query properties.configuration.ingress.fqdn -o tsv)
          az containerapp update \
            --resource-group "$RG" \
            --name "$APP" \
            --set-env-vars "AZURE_DATABASE_URL=secretref:database-url" "MCP_ENTRA_CLIENT_ID=$MCP_CLIENT_ID" "MCP_ENTRA_TENANT_ID=$MCP_TENANT_ID" "MCP_PUBLIC_URL=https://$FQDN" \
            --output none
          wait_for_app

          # The MCP service validates Entra bearer tokens and scopes/roles on /mcp.
          # Keep platform auth disabled so it does not intercept OAuth discovery or readiness routes.
          az containerapp auth update \
            --resource-group "$RG" \
            --name "$APP" \
            --enabled false \
            --unauthenticated-client-action AllowAnonymous \
            --output none
          wait_for_app

          echo "MCP URL: https://$FQDN/mcp" >> "$GITHUB_STEP_SUMMARY"
          az containerapp show --resource-group "$RG" --name "$APP" --query '{name:name, fqdn:properties.configuration.ingress.fqdn, provisioningState:properties.provisioningState, image:properties.template.containers[0].image}' --output json
      - name: Verify MCP endpoint and database connectivity
        shell: bash
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show --resource-group rg-cidef-prod --name cidef-pg-mcp --query properties.configuration.ingress.fqdn -o tsv)
          READY=""
          for attempt in {1..24}; do
            READY=$(curl --fail --silent "https://$FQDN/readyz" || true)
            if [[ "$READY" == *'"database":"connected"'* ]]; then
              echo "PostgreSQL readiness check (SELECT 1): $READY"
              break
            fi
            sleep 5
          done
          if [[ "$READY" != *'"database":"connected"'* ]]; then
            echo "::error::MCP did not become ready or could not connect to Azure PostgreSQL"
            az containerapp logs show --resource-group rg-cidef-prod --name cidef-pg-mcp --tail 100 || true
            exit 1
          fi

          METADATA=$(curl --fail --silent "https://$FQDN/.well-known/oauth-protected-resource")
          [[ "$METADATA" == *'"authorization_servers"'* ]] || { echo "::error::OAuth protected-resource metadata is missing"; exit 1; }

          MCP_STATUS=$(curl --silent --output /tmp/mcp-unauthenticated.json --write-out '%{http_code}' "https://$FQDN/mcp")
          if [[ "$MCP_STATUS" != "401" ]]; then
            echo "::error::Unauthenticated /mcp request returned HTTP $MCP_STATUS (expected 401)"
            cat /tmp/mcp-unauthenticated.json
            exit 1
          fi
          echo "OAuth metadata is available; unauthenticated /mcp is correctly rejected with HTTP 401"
          echo "PostgreSQL SELECT 1 succeeded and /mcp enforces bearer authentication" >> "$GITHUB_STEP_SUMMARY"
