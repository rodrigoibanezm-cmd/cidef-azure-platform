name: Publish isolated Azure sales loader

on:
  push:
    branches: [main]
    paths:
      - 'src/loaders/ventas-raw.js'
      - 'Dockerfile.sales-loader'
      - 'package.json'
      - '.github/workflows/publish-sales-loader.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: az acr login --name cidefprodacr
      - name: Build and publish isolated image
        run: |
          set -euo pipefail
          IMAGE="cidefprodacr.azurecr.io/cidef-azure-sales-validation:${GITHUB_SHA}"
          docker build --file Dockerfile.sales-loader --tag "$IMAGE" .
          docker run --rm --entrypoint node "$IMAGE" --check src/loaders/ventas-raw.js
          docker push "$IMAGE"
          echo "Published $IMAGE"
