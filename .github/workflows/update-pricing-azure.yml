name: Update Azure pricing from Blob

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "Archivo XLSB en cidef/precios/"
        required: true
        type: string
        default: "LISTA DE PRECIOS NOVIEMBRE 02-11-2026.xlsb"

concurrency:
  group: azure-pricing-import
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download selected XLSB from Azure Blob
        id: source
        shell: bash
        env:
          SOURCE_FILENAME: ${{ inputs.filename }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_FILENAME" == *.xlsb ]] || { echo "::error::Se requiere un archivo .xlsb"; exit 1; }
          [[ "$SOURCE_FILENAME" != */* && "$SOURCE_FILENAME" != *\\* && "$SOURCE_FILENAME" != *..* ]] || {
            echo "::error::Ingresa solo el nombre del archivo, sin rutas"
            exit 1
          }
          BLOB_NAME="precios/$SOURCE_FILENAME"
          FILE_PATH="$RUNNER_TEMP/pricing-source.xlsb"
          az storage blob download \
            --account-name cidefprodstorage \
            --container-name cidef \
            --auth-mode key \
            --name "$BLOB_NAME" \
            --file "$FILE_PATH" \
            --overwrite \
            --only-show-errors \
            --output none
          mv "$FILE_PATH" "$RUNNER_TEMP/$SOURCE_FILENAME"
          echo "path=$RUNNER_TEMP/$SOURCE_FILENAME" >> "$GITHUB_OUTPUT"
          echo "name=$SOURCE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Install pricing runtime dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts xlsx@0.18.5 pg@8.16.3

      - name: Import price history and canonical products
        env:
          AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
          PRICE_SOURCE_PATH: ${{ steps.source.outputs.path }}
        run: |
          set -euo pipefail
          node scripts/update-pricing-azure.js "$PRICE_SOURCE_PATH"
