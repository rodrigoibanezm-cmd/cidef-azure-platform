name: Update Azure pricing from Blob

concurrency:
  group: azure-pricing-import
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'scripts/pricing/**'
      - 'scripts/update-pricing-azure.js'
      - 'scripts/compare-pricing-neon-azure.js'
      - '.github/workflows/update-pricing-azure.yml'

permissions:
  contents: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login via OIDC
        id: azure_login
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Find and download the certified source XLSB from Azure Blob
        id: source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          WORK_DIR="$RUNNER_TEMP/azure-pricing"
          mkdir -p "$WORK_DIR"
          az storage blob list \
            --account-name cidefprodstorage \
            --container-name cidef \
            --auth-mode key \
            --prefix precios/ \
            --output json > "$WORK_DIR/blob-list.json"
          python3 - "$WORK_DIR/blob-list.json" "$WORK_DIR/selected.json" <<'PY'
          import json, re, sys
          items = json.load(open(sys.argv[1], encoding="utf-8"))
          pattern = re.compile(r"LISTA.*PRECIOS.*14[-_ ]?10[-_ ]?2026.*\.xlsb$", re.I)
          matches = [x for x in items if pattern.search(x.get("name", "").split("/")[-1])]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one original 14-10-2026 XLSB in Blob; found {len(matches)}")
          with open(sys.argv[2], "w", encoding="utf-8") as f:
              json.dump(matches[0], f)
          print("selected_blob=" + matches[0]["name"])
          PY
          BLOB_NAME=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["name"])' "$WORK_DIR/selected.json")
          FILE_NAME="${BLOB_NAME##*/}"
          az storage blob download \
            --account-name cidefprodstorage \
            --container-name cidef \
            --auth-mode key \
            --name "$BLOB_NAME" \
            --file "$WORK_DIR/$FILE_NAME" \
            --only-show-errors \
            --output none
          echo "path=$WORK_DIR/$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$FILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Install only workbook and PostgreSQL runtime dependencies
        id: dependencies
        continue-on-error: true
        run: npm install --no-save --no-package-lock --ignore-scripts xlsx@0.18.5 pg@8.16.3

      - name: Import append-only price history and add canonical product identities
        id: import
        continue-on-error: true
        env:
          AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
        shell: bash
        run: |
          set +e
          node scripts/update-pricing-azure.js "${{ steps.source.outputs.path }}" > "$RUNNER_TEMP/pricing-import.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pricing-import.log"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -eq 0 ]]; then cp "$RUNNER_TEMP/pricing-import.log" "$RUNNER_TEMP/pricing-import-success.json"; fi

      - name: Verify October 14 parity with Neon (read only)
        id: parity
        if: steps.import.outputs.exit_code == '0'
        continue-on-error: true
        env:
          AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          PRICE_SOURCE_FILE: ${{ steps.source.outputs.name }}
        shell: bash
        run: |
          set +e
          node scripts/compare-pricing-neon-azure.js > "$RUNNER_TEMP/pricing-parity.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pricing-parity.log"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -eq 0 ]]; then cp "$RUNNER_TEMP/pricing-parity.log" "$RUNNER_TEMP/pricing-parity-success.json"; fi

      - name: Publish verification summary
        if: always()
        env:
          AZURE_LOGIN_OUTCOME: ${{ steps.azure_login.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          SOURCE_FILE: ${{ steps.source.outputs.name }}
          IMPORT_EXIT: ${{ steps.import.outputs.exit_code }}
          PARITY_EXIT: ${{ steps.parity.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          REPORT=audit/azure-pricing-last-run.md
          {
            echo "# Azure pricing update"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Azure login: ${AZURE_LOGIN_OUTCOME:-not-run}"
            echo "- Blob source step: ${SOURCE_OUTCOME:-not-run}"
            echo "- Runtime dependencies: ${DEPENDENCIES_OUTCOME:-not-run}"
            echo "- Source file: ${SOURCE_FILE:-unavailable}"
            echo "- Import exit code: ${IMPORT_EXIT:-not-run}"
            echo "- Neon parity exit code: ${PARITY_EXIT:-not-run}"
            if [[ -f "$RUNNER_TEMP/pricing-import-success.json" ]]; then
              echo
              echo "## Import summary"
              echo '~~~json'
              cat "$RUNNER_TEMP/pricing-import-success.json"
              echo '~~~'
            fi
            if [[ -f "$RUNNER_TEMP/pricing-parity-success.json" ]]; then
              echo
              echo "## Parity summary"
              echo '~~~json'
              cat "$RUNNER_TEMP/pricing-parity-success.json"
              echo '~~~'
            fi
          } > "$REPORT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          if ! git diff --cached --quiet; then
            git commit -m "audit: record Azure pricing update result"
            git push origin HEAD:main
          fi
          if [[ "${IMPORT_EXIT:-}" != "0" || "${PARITY_EXIT:-}" != "0" ]]; then
            echo "::error::Azure pricing import or Neon parity check failed; see workflow logs and $REPORT"
            exit 1
          fi
