name: Diagnose SALES VIN cancellation (read-only)
on:
  workflow_dispatch:
    inputs:
      cancelled_vin:
        description: "VIN returned to stock"
        required: true
        type: string
      replacement_vin:
        description: "VIN invoiced as replacement"
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 8
    env:
      AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
      VIN_CANCELLED: ${{ inputs.cancelled_vin }}
      VIN_REPLACEMENT: ${{ inputs.replacement_vin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Inspect both VINs and related credit notes without modifications
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const vins=[process.env.VIN_CANCELLED,process.env.VIN_REPLACEMENT].map(s=>String(s||'').trim().toUpperCase());
          if(vins.some(v=>!(/^[A-HJ-NPR-Z0-9]{17}$/.test(v)))||vins[0]===vins[1])throw Error('INVALID_VINS');
          const c=new pg.Client({connectionString:process.env.AZURE_DATABASE_URL,connectionTimeoutMillis:12000,statement_timeout:25000,application_name:'sales-vin-cancellation-readonly'});
          try{
            await c.connect();await c.query('BEGIN READ ONLY');
            const sales=await c.query(`SELECT upper(btrim(nro_vin_chasis)) vin, id, nro_operacion, nro_factura, factura, fecha_factura, desc_tipo_oper, categoria_cliente
              FROM ventas_raw WHERE upper(btrim(nro_vin_chasis))=ANY($1::text[])
              ORDER BY fecha_factura DESC NULLS LAST, id DESC LIMIT 100`,[vins]);
            console.log(JSON.stringify({section:'sales_raw',rows:sales.rows}));
            const invoices=[...new Set(sales.rows.flatMap(x=>[x.nro_factura,x.factura]).filter(x=>x!=null).map(String))];
            const notes=await c.query(`SELECT to_jsonb(t) AS note FROM notas_credito_raw t
              WHERE (to_jsonb(t)->>'nfactura') = ANY($1::text[])
              ORDER BY to_jsonb(t)->>'snapshot_date' DESC NULLS LAST LIMIT 100`,[invoices]);
            console.log(JSON.stringify({section:'credit_notes_by_invoice',invoice_count:invoices.length,rows:notes.rows}));
            const inventory=await c.query(`SELECT vin,to_jsonb(v) AS row FROM vehiculo_canonico v
              WHERE upper(btrim(vin))=ANY($1::text[]) LIMIT 5`,[vins]);
            console.log(JSON.stringify({section:'inventory_canonical',rows:inventory.rows.map(x=>({vin:x.vin,stock_number:x.row.stock_number??x.row.numero_stock??null,disponible:x.row.disponible,vigente:x.row.vigente}))}));
            const ledger=await c.query(`SELECT source_date::text AS source_date,completed_at,
              result->'sources'->'ventas_raw'->>'status' AS sales_status,
              result->'sources'->'notas_credito_raw'->>'status' AS credit_notes_status,
              result->'sources'->'notas_credito_raw'->>'snapshotDate' AS credit_notes_snapshot
              FROM sales_raw_refresh_runs ORDER BY completed_at DESC LIMIT 3`);
            console.log(JSON.stringify({section:'raw_refresh_runs',rows:ledger.rows}));
            await c.query('ROLLBACK');
          }catch(e){console.error(JSON.stringify({error:e.message,code:e.code}));process.exitCode=1;}
          finally{await c.end().catch(()=>{});}
          NODE
