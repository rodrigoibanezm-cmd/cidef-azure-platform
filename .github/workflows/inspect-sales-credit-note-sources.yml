name: Inspect available SALES credit-note sources (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-sales-credit-note-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 8
    steps:
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: List NC source prefixes without reading file contents
        shell: bash
        run: |
          set -euo pipefail
          az storage blob list --account-name cidefprodstorage --container-name cidef \
            --auth-mode login --prefix ventas/NC_ --num-results 5000 \
            --query '[].name' -o json > "$RUNNER_TEMP/nc-files.json"
          python3 - <<'PY'
          import json,re,os
          from collections import Counter
          names=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'nc-files.json')))
          prefixes=Counter()
          latest={}
          for name in names:
              match=re.fullmatch(r'(ventas/NC_[A-Za-z0-9_-]+_)(\\d{4}_\\d{2}_\\d{2})\\.xlsx',name,re.I)
              if match:
                  prefix,date=match.groups()
                  prefixes[prefix]+=1
                  latest[prefix]=max(date,latest.get(prefix,''))
          print(json.dumps({'source_prefixes':[{'prefix':k,'files':v,'latest':latest[k]} for k,v in sorted(prefixes.items())]}))
          PY
