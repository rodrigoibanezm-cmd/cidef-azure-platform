name: Diagnose Vehiculo Canonico in Azure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 5
    env:
      AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
    steps:
      - name: Inspect canonical VIN coverage (read-only)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AZURE_DATABASE_URL:-}" || { echo "::error::Missing AZURE_DATABASE_URL"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          export PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=30000"
          psql "$AZURE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          BEGIN READ ONLY;
          SELECT
            COUNT(*) AS total_vin,
            COUNT(*) FILTER (WHERE vigente = true) AS vin_vigentes,
            COUNT(*) FILTER (WHERE dealer_id IS NOT NULL) AS vin_con_dealer,
            COUNT(*) FILTER (WHERE canal_salida = 'DEALER' AND dealer_id IS NULL) AS dealer_sin_resolver,
            COUNT(*) FILTER (WHERE fecha_factura IS NOT NULL) AS vin_con_factura,
            MAX(fecha_factura) AS ultima_factura,
            COUNT(*) FILTER (WHERE fecha_inscripcion_rvm IS NOT NULL) AS vin_con_rvm,
            COUNT(*) FILTER (WHERE fecha_inscripcion_rvm >= DATE '2026-10-01') AS rvm_octubre,
            MAX(fecha_inscripcion_rvm) AS ultimo_rvm,
            MAX(canonicalized_at) AS ultima_canonicalizacion
          FROM public.vehiculo_canonico;

          SELECT
            canal_salida,
            COUNT(*) AS vin,
            COUNT(*) FILTER (WHERE dealer_id IS NOT NULL) AS con_dealer,
            COUNT(*) FILTER (WHERE fecha_factura IS NOT NULL) AS con_factura,
            COUNT(*) FILTER (WHERE fecha_inscripcion_rvm IS NOT NULL) AS con_rvm,
            COUNT(*) FILTER (WHERE fecha_inscripcion_rvm >= DATE '2026-10-01') AS rvm_octubre
          FROM public.vehiculo_canonico
          GROUP BY canal_salida
          ORDER BY canal_salida NULLS LAST;

          -- Verify the existing RVM sync in vehiculos_raw before any correction.
          SELECT
            COUNT(*) AS vehiculos_raw_rows,
            COUNT(*) FILTER (WHERE fecha_inscripcion_rvm IS NOT NULL) AS raw_con_rvm,
            COUNT(*) FILTER (WHERE fecha_inscripcion_rvm >= DATE '2026-10-01') AS raw_rvm_octubre,
            MAX(fecha_inscripcion_rvm) AS raw_ultimo_rvm,
            MAX(fecha_actualizacion_rvm) AS raw_ultima_sincronizacion
          FROM public.vehiculos_raw;

          SELECT
            COUNT(*) FILTER (WHERE r.fecha_inscripcion_rvm IS DISTINCT FROM c.fecha_inscripcion_rvm) AS vin_rvm_distinto,
            COUNT(*) FILTER (WHERE r.fecha_inscripcion_rvm IS NOT NULL AND c.fecha_inscripcion_rvm IS NULL) AS vin_rvm_pendiente_canonico,
            COUNT(*) FILTER (WHERE c.fecha_inscripcion_rvm IS NOT NULL AND r.fecha_inscripcion_rvm IS NULL) AS vin_rvm_solo_canonico,
            COUNT(*) FILTER (WHERE r.fecha_inscripcion_rvm >= DATE '2026-10-01' AND c.fecha_inscripcion_rvm IS NULL) AS octubre_pendiente
          FROM public.vehiculos_raw r
          JOIN public.vehiculo_canonico c ON c.vin = upper(btrim(r.vin_chasis));
          ROLLBACK;
          SQL
