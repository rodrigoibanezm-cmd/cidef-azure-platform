name: CI SALES derivadas
on:
  push:
    paths:
      - 'scripts/refresh-sales-derived-azure.js'
      - 'Dockerfile.sales-refresh'
      - 'src/loaders/sales/refresh.js'
      - 'lib/canonical/refresh-vehiculo-canonico-v01.js'
      - 'lib/canonical/vehiculo-salida-v01.js'
      - 'test/sales-source-refresh.test.js'
      - 'src/loaders/sales/sync-vehiculos-rvm.js'
      - 'test/sales-derived-orchestration.test.js'
      - 'test/sales-incremental-postgres.test.js'
      - '.github/workflows/ci-sales-derived.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxis y ausencia de cargas RAW en el ejecutor
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/refresh-sales-derived-azure.js
          node --check scripts/refresh-forum-ventas-snapshot-azure.js
          node --check src/loaders/sales/refresh.js
          node --check src/loaders/sales/sync-vehiculos-rvm.js
          if grep -Eq 'runSalesRawRefresh|runSalesRefresh' scripts/refresh-sales-derived-azure.js; then
            echo "::error::Derivadas no deben cargar RAW"
            exit 1
          fi
      - name: Dependencias existentes para pruebas de módulos
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Prueba focalizada de orquestación
        env:
          PG_TEST_DATABASE_URL: postgresql://fixture:fixture@localhost:5432/fixture
        run: node --test test/sales-derived-orchestration.test.js test/sales-source-refresh.test.js test/sales-incremental-postgres.test.js
      - name: Construir imagen local sin publicar ni ejecutar en Azure
        run: docker build -f Dockerfile.sales-refresh -t cidef-sales-derived-ci .
